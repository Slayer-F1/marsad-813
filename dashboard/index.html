<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSAD 813 - HAB Early Warning</title>
<style>
/* ================= MARSAD 813 control-room theme =================
   Committed dark ops-room design (deep navy water palette).
   Chart series (validated for CVD + contrast on this surface):
     observed #d95926 · corrected #199e70 · true #3987e5
   Status colors are reserved and always paired with a text label
   and a shape glyph - never color alone.                          */
:root{
  color-scheme: dark;
  --bg:        #060b14;
  --panel:     #0e1a2b;
  --panel2:    #13233a;
  --border:    rgba(148,184,220,.14);
  --ink:       #e9f1f9;
  --ink2:      #a7bccf;
  --ink3:      #6d8299;
  --grid:      #1b2c42;
  --gridhi:    #2a4260;
  --accent:    #2fbfae;
  --s-obs:     #d95926;
  --s-cor:     #199e70;
  --s-true:    #3987e5;
  /* benchmark series (v0.2): the three literature algorithms read as one warm
     family, MARSAD keeps the brand teal - so "classical vs ours" is legible
     before any label is read. Every bar also carries its printed value. */
  --s-oc4:     #d95926;
  --s-oc3m:    #e8a33c;
  --s-ndci:    #9b7ede;
  --st-green:  #0ca30c;
  --st-amber:  #fab219;
  --st-red:    #d03b3b;
  --mono: ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
body{
  background:
    radial-gradient(1100px 500px at 75% -10%, rgba(47,191,174,.07), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(57,135,229,.06), transparent 60%),
    var(--bg);
  color:var(--ink);
  font:14px/1.45 -apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.topbar{height:3px;background:linear-gradient(90deg,var(--accent),var(--s-true) 45%,transparent 90%)}

/* ---------- header ---------- */
header.hd{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding:14px 0 18px}
.brand{display:flex;gap:14px;align-items:center}
.brand .mark{flex:none}
.brand h1{font-size:21px;letter-spacing:.10em;font-weight:700}
.brand h1 .n813{color:var(--accent);font-weight:600}
.brand .sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.brand .sub .ar{font-size:14px;color:var(--accent);letter-spacing:0}
.hd-right{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.hd-meta{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.stamp{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.stamp b{color:var(--ink2);font-weight:600}
.badge-syn{font-size:10.5px;letter-spacing:.09em;font-weight:700;color:var(--st-amber);
  border:1px solid rgba(250,178,25,.45);border-radius:4px;padding:3px 8px;background:rgba(250,178,25,.08)}
.sys{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px}
.sys .lbl{font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-weight:700}
.sys .counts{font-size:12px;color:var(--ink2);font-family:var(--mono)}

/* ---------- status chips (label + shape glyph, never color alone) ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.07em;
  border-radius:999px;padding:3px 10px;border:1px solid;color:var(--ink)}
.chip .g{font-size:10px;line-height:1}
.chip.GREEN{border-color:rgba(12,163,12,.55);background:rgba(12,163,12,.12)}
.chip.GREEN .g{color:var(--st-green)}
.chip.AMBER{border-color:rgba(250,178,25,.55);background:rgba(250,178,25,.10)}
.chip.AMBER .g{color:var(--st-amber)}
.chip.RED{border-color:rgba(208,59,59,.60);background:rgba(208,59,59,.14)}
.chip.RED .g{color:var(--st-red)}

/* ---------- sections ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h .k{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--accent)}
.sec-h .t{font-size:15px;font-weight:650;color:var(--ink)}
.sec-h .s{font-size:12px;color:var(--ink3)}
.sec-h::after{content:"";flex:1;height:1px;background:var(--border);align-self:center}

/* ---------- intake cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  cursor:pointer;transition:border-color .15s, transform .15s;position:relative}
.card:hover{border-color:rgba(148,184,220,.34)}
.card:focus-visible{outline:2px solid #4da3ff;outline-offset:2px}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.selected::after{content:"CHARTED";position:absolute;top:-8px;right:12px;font-size:9px;
  letter-spacing:.12em;font-weight:700;color:#04211c;background:var(--accent);border-radius:3px;padding:2px 6px}
.card.lvl-RED{box-shadow:0 0 22px rgba(208,59,59,.10)}
.card.lvl-RED.selected{box-shadow:0 0 0 1px var(--accent) inset,0 0 22px rgba(208,59,59,.10)}
.c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.c-name{font-size:16px;font-weight:700}
.c-kind{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:10.5px;letter-spacing:.08em;
  font-weight:600;margin-top:3px}
.c-kind svg{flex:none}
.c-geo{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px}
.c-mid{display:flex;gap:14px;align-items:center;margin:10px 0 4px}
.c-facts{display:grid;gap:5px;font-size:12.5px;min-width:0}
.c-facts .fl{color:var(--ink3);font-size:10.5px;letter-spacing:.08em;font-weight:600}
.c-facts .fv{color:var(--ink);font-weight:600}
.c-facts .fv small{color:var(--ink2);font-weight:400}
.trend{font-size:12px;font-weight:600}
.trend.up{color:var(--st-red)} .trend.dn{color:var(--st-green)} .trend.fl{color:var(--ink2)}
.probs{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11px;color:var(--ink2);
  border-top:1px solid var(--border);margin-top:9px;padding-top:9px}
.probs b{color:var(--ink);font-weight:600}
.rationale{list-style:none;margin-top:9px;border-top:1px solid var(--border);padding-top:8px}
.rationale li{color:var(--ink2);font-size:12px;padding:2.5px 0 2.5px 14px;position:relative}
.rationale li::before{content:"›";position:absolute;left:2px;color:var(--accent)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-red);
  animation:pul 1.6s ease-in-out infinite;vertical-align:1px}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(208,59,59,.55)}55%{box-shadow:0 0 0 7px rgba(208,59,59,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.card{transition:none}}

/* ---------- chart panels ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.p-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.p-h .t{font-size:14.5px;font-weight:650}
.p-h .s{font-size:12px;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2);margin:4px 0 2px}
.legend .li{display:inline-flex;align-items:center;gap:7px}
.legend svg{flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--panel2);
  border:1px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px}
.tabs button .d{width:8px;height:8px;border-radius:50%;flex:none}
.tabs button[aria-selected="true"]{color:#04211c;background:var(--accent);border-color:var(--accent)}
.tabs button[aria-selected="true"] .d{outline:2px solid rgba(4,33,28,.35)}
.tabs button:focus-visible{outline:2px solid #4da3ff;outline-offset:2px}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.axis-t{font-size:11px;fill:var(--ink3)}
.axis-cap{font-size:10px;fill:var(--ink3);letter-spacing:.08em;font-weight:600}
.note-t{font-size:10.5px;fill:var(--ink2)}
.cap{font-size:11.5px;color:var(--ink3);margin-top:8px}
.cap b{color:var(--ink2);font-weight:600}
#tt{position:fixed;z-index:40;pointer-events:none;background:#050d18;border:1px solid var(--gridhi);
  border-radius:8px;padding:7px 10px;font-size:12px;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.5);
  display:none;max-width:260px}
#tt .h{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-bottom:3px}
#tt .r{display:flex;align-items:center;gap:7px;padding:1px 0}
#tt .sw{width:9px;height:9px;border-radius:2px;flex:none}
#tt .v{margin-left:auto;font-family:var(--mono);padding-left:12px}
details.tblv{margin-top:10px}
details.tblv summary{cursor:pointer;font-size:12px;color:var(--ink3)}
details.tblv .scroll{max-height:220px;overflow:auto;margin-top:8px;border:1px solid var(--border);border-radius:8px}
table.dt{border-collapse:collapse;width:100%;font-size:12px}
table.dt th,table.dt td{padding:4px 12px;text-align:right;font-family:var(--mono);white-space:nowrap}
table.dt th{position:sticky;top:0;background:var(--panel2);color:var(--ink2);font-weight:600;text-align:right}
table.dt td{color:var(--ink2);border-top:1px solid var(--grid)}
table.dt td:first-child,table.dt th:first-child{text-align:left}

/* ---------- metrics ---------- */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.tile .l{font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--ink3)}
.tile .v{font-size:26px;font-weight:650;margin-top:6px}
.tile .v small{font-size:14px;color:var(--ink2);font-weight:500}
.tile .d{font-size:11.5px;margin-top:4px;color:var(--ink3)}
.tile .d.good{color:var(--st-green);font-weight:600}
.cmx-wrap{overflow-x:auto}
table.cmx{border-collapse:separate;border-spacing:3px;font-size:12.5px;margin-top:4px}
table.cmx th{font-weight:600;color:var(--ink2);padding:5px 9px;text-align:center;font-size:11.5px}
table.cmx th.rowh{text-align:right}
table.cmx td{min-width:76px;text-align:center;padding:10px 7px;border-radius:6px;
  font-family:var(--mono);font-weight:600}
table.cmx td .pc{display:block;font-size:10px;font-weight:400;opacity:.85;margin-top:2px}
.cmx-cap{font-size:11.5px;color:var(--ink3);margin-top:10px}

/* ---------- per-intake model uncertainty (v0.2) ---------- */
.unc{margin-top:9px;border-top:1px solid var(--border);padding-top:9px}
.unc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.unc-h .ul{font-size:10.5px;letter-spacing:.08em;font-weight:600;color:var(--ink3)}
.unc-h .uv{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.ubar{height:5px;border-radius:3px;background:var(--panel2);margin-top:6px;overflow:hidden}
.ubar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.unc-m{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:5px}
.unc-na{font-size:11px;line-height:1.4;color:var(--ink3);margin-top:5px}
.review{display:flex;align-items:center;gap:7px;margin-top:8px;padding:5px 9px;border-radius:6px;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--st-amber);
  background:rgba(250,178,25,.10);border:1px solid rgba(250,178,25,.45)}
.review .g{font-size:12px;line-height:1;flex:none}

/* ---------- v0.2 evidence sections (benchmark + sensor ablation) ---------- */
.evsec .tiles{margin-bottom:14px}
.hn{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;padding:10px 14px;
  border:1px solid rgba(250,178,25,.30);border-radius:10px;background:rgba(250,178,25,.06);
  font-size:12px;line-height:1.5;color:var(--ink2)}
.hn .k{flex:none;margin-top:1px;padding:2px 7px;border:1px solid rgba(250,178,25,.45);border-radius:4px;
  font-size:9.5px;letter-spacing:.10em;font-weight:700;color:var(--st-amber);white-space:nowrap}
.bar-v{font-size:10px;font-weight:600}
.grp-l{font-size:11.5px;font-weight:600;fill:var(--ink2)}
.grp-l.hi{fill:var(--st-red);font-weight:700}
.grp-l.hi2{fill:var(--accent);font-weight:700}
.grp-s{font-size:10px;fill:var(--ink3)}
.grp-620.yes{fill:var(--st-green)}
.grp-620.no{fill:var(--st-red)}
ul.snotes{list-style:none;display:grid;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
ul.snotes li{position:relative;padding-left:16px;font-size:12px;color:var(--ink2)}
ul.snotes li::before{content:"›";position:absolute;left:2px;color:var(--accent)}
ul.snotes b{color:var(--ink);font-weight:600}
.tagpc{font-family:var(--mono);font-size:10.5px;font-weight:600;margin-left:7px;white-space:nowrap}
.tagpc.yes{color:var(--st-green)}
.tagpc.no{color:var(--st-red)}

/* ---------- 03 - two-axis sensor verdict (v0.2 spatial ablation) ----------
   The section stacks three panels: the pass/fail matrix, the patch-size
   collapse chart, then the original spectral bar chart kept as support. */
/* minmax(0,1fr) + min-width:0 because a grid item's automatic minimum size is
   its MIN-CONTENT size, and these panels hold deliberately wide inner tables
   and charts. Without both, the min-width:700px table below would widen the
   track and push the whole page into a horizontal scroll on a phone instead
   of scrolling inside its own .vt-wrap box. */
.pstack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.pstack > .panel{min-width:0}
.qm-wrap{overflow-x:auto}
table.qm{border-collapse:separate;border-spacing:8px;width:100%;min-width:560px;margin:2px 0 4px}
table.qm th{font-size:10px;letter-spacing:.10em;font-weight:700;color:var(--ink2);
  padding:2px 4px;vertical-align:bottom;text-align:center}
table.qm th.rowh{text-align:right;vertical-align:middle;width:172px}
table.qm th span{display:block;font-size:10.5px;letter-spacing:0;font-weight:400;
  color:var(--ink3);margin-top:3px;line-height:1.35}
table.qm td.q{border:1px solid;border-radius:10px;padding:11px 13px;vertical-align:top;width:50%}
table.qm td.q.ok{border-color:rgba(12,163,12,.55);background:rgba(12,163,12,.10)}
table.qm td.q.half{border-color:rgba(250,178,25,.50);background:rgba(250,178,25,.07)}
table.qm td.q.bad{border-color:rgba(208,59,59,.55);background:rgba(208,59,59,.10)}
.q-lab{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.09em;font-weight:700}
.q-lab .g{font-size:11px;line-height:1;flex:none}
td.q.ok .q-lab{color:var(--st-green)}
td.q.half .q-lab{color:var(--st-amber)}
td.q.bad .q-lab{color:var(--st-red)}
.q-s{margin-top:9px;font-size:12.5px;color:var(--ink);font-weight:600}
.q-s .m{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;
  color:var(--ink3);margin-top:2px;line-height:1.45}
.q-empty{margin-top:9px;font-size:12px;color:var(--ink3)}
.vp{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.07em;
  border:1px solid;border-radius:999px;padding:2px 9px;white-space:nowrap}
.vp .g{font-size:10px;line-height:1}
.vp.pass{color:var(--st-green);border-color:rgba(12,163,12,.55);background:rgba(12,163,12,.12)}
.vp.fail{color:var(--st-red);border-color:rgba(208,59,59,.60);background:rgba(208,59,59,.14)}
.vt-wrap{overflow-x:auto;margin-top:14px}
table.vt{border-collapse:collapse;width:100%;min-width:700px;font-size:12.5px}
table.vt th,table.vt td{padding:7px 10px;text-align:right;white-space:nowrap}
table.vt th{color:var(--ink3);font-size:10px;letter-spacing:.08em;font-weight:700;
  border-bottom:1px solid var(--border);vertical-align:bottom}
table.vt td{font-family:var(--mono);color:var(--ink2);border-top:1px solid var(--grid)}
table.vt td:first-child,table.vt th:first-child{text-align:left;font-family:inherit;
  color:var(--ink);font-weight:600;white-space:normal}
table.vt td.c,table.vt th.c{text-align:center}
table.vt tr.me td{background:rgba(47,191,174,.07)}
table.vt tr.me td:first-child{color:var(--accent)}
.asu{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;
  color:var(--ink3);border:1px dashed var(--gridhi);border-radius:4px;padding:1px 5px;margin-left:6px}
.qa{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:11px 14px;
  border:1px solid rgba(217,89,38,.35);border-radius:10px;background:rgba(217,89,38,.07);
  font-size:12px;line-height:1.55;color:var(--ink2)}
.qa .k{flex:none;margin-top:1px;padding:2px 7px;border:1px solid rgba(217,89,38,.50);border-radius:4px;
  font-size:9.5px;letter-spacing:.10em;font-weight:700;color:var(--s-obs);white-space:nowrap}
.qa b{color:var(--ink);font-weight:650}
.asum{margin-top:12px;padding:9px 13px;border:1px dashed var(--gridhi);border-radius:9px;
  font-size:11.5px;line-height:1.5;color:var(--ink3)}
.asum b{color:var(--ink2);font-weight:600}
.sub-tag{display:inline-block;font-size:9.5px;letter-spacing:.10em;font-weight:700;color:var(--ink3);
  border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin-right:9px;vertical-align:2px}
.lead{font-size:12px;line-height:1.55;color:var(--ink2);margin:2px 0 12px}
.lead b{color:var(--ink);font-weight:650}
.ser-l{font-size:10.5px;font-weight:600}
.pnote{font-size:10.5px;font-weight:600}
.mini{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px 20px;text-align:center}
.mini h4{font-size:13.5px;font-weight:650;color:var(--ink);margin-bottom:6px}
.mini p{font-size:12.5px;color:var(--ink2);max-width:640px;margin:0 auto}
.mini code{display:inline-block;font-family:var(--mono);font-size:12.5px;color:var(--accent);
  background:#081120;border:1px solid var(--gridhi);border-radius:8px;padding:9px 15px;margin:12px 0 4px}

/* ---------- footer / notice ---------- */
footer{margin-top:34px;border-top:1px solid var(--border);padding-top:14px;
  display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;
  font-size:11.5px;color:var(--ink3)}
.notice{min-height:78vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.notice .box{max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:38px 34px}
.notice h2{font-size:18px;letter-spacing:.06em;margin:14px 0 6px}
.notice p{color:var(--ink2);font-size:13.5px;margin-top:6px}
.notice code{display:block;font-family:var(--mono);font-size:13px;color:var(--accent);
  background:#081120;border:1px solid var(--gridhi);border-radius:8px;padding:12px 16px;margin:18px 0 8px}
@media (max-width:720px){
  .hd-meta{align-items:flex-start}
  header.hd{flex-direction:column;align-items:flex-start}
  .wrap{padding:14px 12px 32px}
  .panel{padding:12px}
  /* The grouped bar charts carry a printed value on every bar, so they stop
     being legible below ~640 px. Let them scroll inside their own box rather
     than shrink the type; the page itself never scrolls sideways. */
  #benchchart,#ablchart,#patchchart{overflow-x:auto}
  #benchchart svg,#ablchart svg{min-width:640px}
  #patchchart svg{min-width:700px}
}
</style>
</head>
<body>
<div class="topbar"></div>
<div id="app" class="wrap"></div>
<div id="tt" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="benchmark.js"></script>
<script>
"use strict";
(function () {
  const D = window.MARSAD_DATA;
  // Optional: written by scripts/run_benchmark.py. Sections 02 and 03 degrade
  // to a "run the benchmark" notice when it is absent; nothing else depends on it.
  const B = window.MARSAD_BENCHMARK;
  const app = document.getElementById("app");

  /* ---------- shared helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴",
               "5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
  const sci = x => {                       // 0.00061 -> "6.10×10⁻⁴"
    if (!x) return "0";
    const e = Math.floor(Math.log10(Math.abs(x)));
    return (x / 10 ** e).toFixed(2) + "×10" +
           String(e).split("").map(c => SUP[c]).join("");
  };
  const LVL = {
    GREEN: {col: "var(--st-green)", hex: "#0ca30c", glyph: "●"},   // ●
    AMBER: {col: "var(--st-amber)", hex: "#fab219", glyph: "◆"},   // ◆
    RED:   {col: "var(--st-red)",   hex: "#d03b3b", glyph: "▲"},   // ▲
  };
  const CLASS_NAME = {no_bloom: "No bloom", dinoflagellate: "Dinoflagellate",
                      cyanobacteria: "Cyanobacteria"};
  const chip = lvl =>
    `<span class="chip ${lvl}"><span class="g">${LVL[lvl].glyph}</span>${lvl}</span>`;

  const logoSVG = (s) => `
    <svg class="mark" width="${s}" height="${s}" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="20" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity=".45"/>
      <circle cx="22" cy="22" r="13" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity=".7"/>
      <path d="M 22 2 A 20 20 0 0 1 42 22" fill="none" stroke="var(--accent)" stroke-width="2.6"/>
      <circle cx="22" cy="22" r="4.5" fill="var(--accent)"/>
      <path d="M 25.2 18.8 L 38 6" stroke="var(--accent)" stroke-width="1.6"/>
      <circle cx="38" cy="6" r="2.4" fill="var(--accent)"/>
    </svg>`;

  /* ---------- missing-data notice ---------- */
  if (!D) {
    document.title = "MARSAD 813 - no data";
    app.innerHTML = `
      <div class="notice"><div class="box">
        ${logoSVG(46)}
        <h2>MARSAD 813 <span style="color:var(--accent)">·</span>
            <span dir="rtl">مَرصَد</span></h2>
        <p><b>No data loaded</b> - <code style="display:inline;padding:1px 6px;margin:0">dashboard/data.js</code>
           was not found next to this page.</p>
        <p>Generate it by running the demo pipeline from the repo root:</p>
        <code>python scripts/run_demo.py</code>
        <p>then reload this page.</p>
      </div></div>`;
    return;
  }

  /* ---------- derived quantities ---------- */
  const intakes = D.intakes;
  const counts = {GREEN: 0, AMBER: 0, RED: 0};
  intakes.forEach(it => counts[it.risk.level]++);
  const worst = counts.RED ? "RED" : (counts.AMBER ? "AMBER" : "GREEN");
  const mm = D.model_metrics;
  const rmseGain = (1 - mm.stage1_rmse_after / mm.stage1_rmse_before) * 100;
  const holdoutN = mm.stage2_confusion.flat().reduce((a, b) => a + b, 0);
  // Forward-looking OUTLOOK (forecast day+7 vs today) - deliberately not
  // called "trend": the rationale strings describe the RECENT history trend,
  // which can disagree with where the forecast says risk is heading.
  const trendOf = it => {
    const d = it.forecast[it.forecast.length - 1].score - it.risk.score;
    const cls = d > 0.02 ? "up" : (d < -0.02 ? "dn" : "fl");
    const word = {up: "worsening", dn: "improving", fl: "steady"}[cls];
    const arrow = {up: "▴", dn: "▾", fl: "▸"}[cls];
    return {d, cls, word, arrow,
            txt: `${arrow} ${word} ${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(2)} / 7 d`};
  };

  /* ---------- SVG geometry helpers ---------- */
  const polar = (cx, cy, r, deg) => {           // deg clockwise from 12 o'clock
    const a = deg * Math.PI / 180;
    return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  };
  const arcPath = (cx, cy, r, a0, a1) => {
    const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
    return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const linePath = pts =>
    pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");

  /* Grouped bar chart - shared by sections 02 and 03. Deliberately built on
     the same conventions as the line charts above: fixed viewBox that scales
     to the panel width, .axis-t / .axis-cap / .note-t type classes, --grid
     rules and the one shared #tt tooltip. Every bar prints its own value, so
     colour is never the only channel carrying the number. */
  function groupedBars(cfg) {
    const {W, H, l, r, t, b} = cfg;
    const pw = W - l - r, ph = H - t - b;
    const gw = pw / cfg.groups.length;
    const slot = gw * (cfg.slot || 0.72);
    const bw = slot / cfg.series.length;
    const by = v => t + (1 - Math.max(0, Math.min(v, cfg.yMax)) / cfg.yMax) * ph;
    const gL = gi => l + gi * gw;
    const bx = (gi, si) => gL(gi) + (gw - slot) / 2 + si * bw;
    const geom = {W, H, l, r, t, b, pw, ph, gw, slot, bw, by, gL, bx};
    const tips = [];

    const grid = cfg.ticks.map(v => `
      <line x1="${l}" x2="${l + pw}" y1="${by(v).toFixed(1)}" y2="${by(v).toFixed(1)}"
            stroke="var(--grid)" stroke-width="1"/>
      <text class="axis-t" x="${l - 8}" y="${(by(v) + 4).toFixed(1)}" text-anchor="end">${cfg.fmtTick(v)}</text>
      ${cfg.fmtRight ? `<text class="axis-t" x="${l + pw + 9}" y="${(by(v) + 4).toFixed(1)}">${cfg.fmtRight(v)}</text>` : ""}`
    ).join("");

    let hi = "", bars = "", labs = "";
    cfg.groups.forEach((g, gi) => {
      if (g.hi) {
        hi += `
        <rect x="${(gL(gi) + 3).toFixed(1)}" y="${t - 24}" width="${(gw - 6).toFixed(1)}"
              height="${(ph + 24).toFixed(1)}" rx="9" fill="${g.hi.fill}"
              stroke="${g.hi.stroke}" stroke-width="1" stroke-dasharray="4 3"/>
        <text class="axis-cap" x="${(gL(gi) + gw / 2).toFixed(1)}" y="${t - 10}"
              text-anchor="middle" fill="${g.hi.stroke}">${esc(g.hi.label)}</text>`;
      }
      cfg.series.forEach((s, si) => {
        const v = g.values[s.key];
        const x = bx(gi, si), y = by(v), h = Math.max(2, t + ph - y);
        bars += `
        <rect x="${(x + 2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 4).toFixed(1)}"
              height="${h.toFixed(1)}" rx="2" fill="${s.col}"/>
        <text class="bar-v" x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}"
              text-anchor="middle" fill="${s.col}">${cfg.fmtVal(v)}</text>
        <rect class="hb" data-tip="${tips.length}" x="${x.toFixed(1)}" y="${t}"
              width="${bw.toFixed(1)}" height="${ph}" fill="transparent"/>`;
        tips.push(`<div class="h">${esc(g.label)}${g.sub ? " · " + esc(g.sub) : ""}</div>
          <div class="r"><span class="sw" style="background:${s.col}"></span>${esc(s.name)}
            <span class="v">${cfg.fmtTip(v)}</span></div>`);
      });
      labs += cfg.groupLabel(g, gL(gi) + gw / 2, t + ph);
    });

    return {tips, svg: `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria)}">
        ${hi}${grid}
        <line x1="${l}" x2="${l + pw}" y1="${t + ph}" y2="${t + ph}" stroke="var(--gridhi)" stroke-width="1"/>
        <text class="axis-cap" x="${l}" y="15" fill="var(--ink3)">${esc(cfg.yCap)}</text>
        ${bars}${labs}${cfg.extra ? cfg.extra(geom) : ""}
      </svg>`};
  }

  /* Draw a grouped bar chart into a container and wire its tooltips. */
  function drawBars(containerId, chart) {
    const host = document.getElementById(containerId);
    host.innerHTML = chart.svg;
    const svg = host.querySelector("svg");
    svg.querySelectorAll("rect.hb").forEach(rc => {
      rc.addEventListener("mousemove",
        e => showTT(chart.tips[+rc.dataset.tip], e.clientX, e.clientY));
    });
    svg.addEventListener("mouseleave", hideTT);
  }

  const barSwatch = (col, name) => `
    <span class="li"><svg width="14" height="10" aria-hidden="true">
      <rect width="14" height="10" rx="2" fill="${col}"/></svg>${name}</span>`;

  /* Wrap a label into at most two lines for the SVG x-axis. */
  const wrap2 = (s, max) => {
    const out = [""];
    s.split(" ").forEach(w => {
      const cur = out[out.length - 1];
      if (!cur) out[out.length - 1] = w;
      else if ((cur + " " + w).length <= max) out[out.length - 1] = cur + " " + w;
      else if (out.length < 2) out.push(w);
      else out[1] += " " + w;
    });
    return out;
  };

  /* Score dial: 240° gauge, threshold notches at 0.35 / 0.65 (operator policy). */
  function dialSVG(score, lvl) {
    const cx = 47, cy = 50, r = 35, a0 = -120, sweep = 240;
    const av = a0 + sweep * Math.min(1, Math.max(0, score));
    const notch = (v, col) => {
      const a = a0 + sweep * v;
      const [x0, y0] = polar(cx, cy, r - 6, a), [x1, y1] = polar(cx, cy, r + 6, a);
      return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"
                stroke="${col}" stroke-width="1.6" opacity=".55"/>`;
    };
    return `
    <svg width="94" height="86" viewBox="0 0 94 92" role="img"
         aria-label="Risk index ${score.toFixed(2)} of 1, level ${lvl}">
      <path d="${arcPath(cx, cy, r, a0, a0 + sweep)}" fill="none"
            stroke="var(--panel2)" stroke-width="8" stroke-linecap="round"/>
      <path d="${arcPath(cx, cy, r, a0, Math.max(av, a0 + 1))}" fill="none"
            stroke="${LVL[lvl].col}" stroke-width="8" stroke-linecap="round"/>
      ${notch(0.35, "var(--st-amber)")}${notch(0.65, "var(--st-red)")}
      <text x="${cx}" y="${cy + 5}" text-anchor="middle"
            style="font-size:21px;font-weight:650" fill="var(--ink)">${score.toFixed(2)}</text>
      <text x="${cx}" y="${cy + 20}" text-anchor="middle"
            style="font-size:8.5px;letter-spacing:.14em" fill="var(--ink3)">RISK</text>
    </svg>`;
  }

  const kindIcon = kind => kind === "reservoir"
    ? `<svg width="13" height="11" viewBox="0 0 13 11" aria-hidden="true">
         <path d="M1 10 L1 4 Q6.5 0 12 4 L12 10" fill="none" stroke="var(--ink3)" stroke-width="1.3"/>
         <path d="M2.5 7.5 q1 -.9 2 0 t2 0 t2 0 t2 0" fill="none" stroke="var(--ink3)" stroke-width="1.1"/>
       </svg>`
    : `<svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true">
         <path d="M1 3 q1.6-1.6 3.2 0 t3.2 0 t3.2 0 t2.4 0" fill="none" stroke="var(--ink3)" stroke-width="1.2"/>
         <path d="M1 7 q1.6-1.6 3.2 0 t3.2 0 t3.2 0 t2.4 0" fill="none" stroke="var(--ink3)" stroke-width="1.2"/>
       </svg>`;

  /* ---------- static page skeleton ---------- */
  app.innerHTML = `
  <header class="hd">
    <div class="brand">
      ${logoSVG(44)}
      <div>
        <h1>MARSAD <span class="n813">813</span></h1>
        <div class="sub"><span class="ar" dir="rtl">مَرصَد</span>
          · Hyperspectral harmful-algal-bloom early warning · Gulf of Oman &amp; Sharjah intakes</div>
      </div>
    </div>
    <div class="hd-right">
      <div class="sys" role="status">
        <span class="lbl">SYSTEM STATUS</span>
        ${counts.RED ? '<span class="pulse" aria-hidden="true"></span>' : ""}
        ${chip(worst)}
        <span class="counts">${counts.RED} RED · ${counts.AMBER} AMBER · ${counts.GREEN} GREEN</span>
      </div>
      <div class="hd-meta">
        <span class="badge-syn" title="All spectra, labels and scores are simulated - no real satellite data behind this view.">SYNTHETIC DEMONSTRATION DATA</span>
        <span class="stamp">generated <b>${esc(D.generated_utc)}</b></span>
      </div>
    </div>
  </header>

  <section class="sec" aria-labelledby="sh1">
    <div class="sec-h"><span class="k">01</span><span class="t" id="sh1">Intake risk board</span>
      <span class="s">model confidence per intake · click or press Enter on a card to chart it in 04</span></div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="sec evsec" aria-labelledby="shB">
    <div class="sec-h"><span class="k">02</span><span class="t" id="shB">Why standard algorithms fail here</span>
      <span class="s">chlorophyll-a retrieval error by water regime · simulated</span></div>
    <div id="bench-body"></div>
  </section>

  <section class="sec evsec" aria-labelledby="shA">
    <div class="sec-h"><span class="k">03</span><span class="t" id="shA">Spectral reach and pixel size are both required</span>
      <span class="s">two-axis sensor ablation at intake scale · same MARSAD models · simulated</span></div>
    <div id="abl-body"></div>
  </section>

  <section class="sec" aria-labelledby="sh2">
    <div class="sec-h"><span class="k">04</span><span class="t" id="sh2">Risk outlook</span>
      <span class="s">30-day history + 7-day forecast · risk index [0–1]</span></div>
    <div class="panel">
      <div class="tabs" role="tablist" aria-label="Select intake" id="tabs"></div>
      <div class="p-h">
        <span class="t" id="rc-title"></span>
        <span class="s" id="rc-sub"></span>
      </div>
      <div class="chart-wrap" id="riskchart"></div>
      <details class="tblv"><summary>View data table</summary>
        <div class="scroll"><table class="dt" id="risktable"></table></div>
      </details>
    </div>
  </section>

  <section class="sec" aria-labelledby="sh3">
    <div class="sec-h"><span class="k">05</span><span class="t" id="sh3">Stage-1 shallow-water correction</span>
      <span class="s">example bloom pixel · 205 bands · 400–1700 nm</span></div>
    <div class="panel">
      <div class="p-h">
        <span class="t">Remote-sensing reflectance R<sub>rs</sub> before / after correction</span>
        <span class="legend" id="sp-legend"></span>
      </div>
      <div class="chart-wrap" id="specchart"></div>
      <div class="cap"><b>Key wavelengths</b> - 443 / 675 nm chl-a absorption · 555 nm green peak ·
        620 nm phycocyanin (cyanobacteria) · 665–708 nm NDCI / bloom red edge.
        Clean water is ~black in SWIR: the flat offset the observed spectrum keeps out to 1700 nm is
        surface/water-column contamination (sunglint plus residual bottom signal), which Stage&nbsp;1 removes.</div>
    </div>
  </section>

  <section class="sec" aria-labelledby="sh4">
    <div class="sec-h"><span class="k">06</span><span class="t" id="sh4">Model metrics</span>
      <span class="s">held-out synthetic pixels (training holdout)</span></div>
    <div class="metrics">
      <div class="tiles" id="tiles"></div>
      <div class="panel">
        <div class="p-h"><span class="t">Stage-2 confusion matrix</span>
          <span class="s">rows = true class · columns = predicted</span></div>
        <div class="cmx-wrap"><table class="cmx" id="cmx"></table></div>
        <div class="cmx-cap">Cell shade ∝ share of the true class (row-normalised); count on top, row-% underneath.</div>
      </div>
    </div>
  </section>

  <footer>
    <span>MARSAD 813 - <span dir="rtl">مَرصَد</span> · Arab 813 Space Hackathon</span>
    <span>Synthetic demonstration data - not operational guidance</span>
    <span>205-band simulated spectra · 400–1700 nm</span>
  </footer>`;

  /* ---------- 01 · intake cards ----------
     v0.2: each card also carries the ENSEMBLE model uncertainty for that
     intake (uncertainty.EnsembleClassifier, averaged over its pixels).
     It is reported only - by contract it never moves a risk level - and a
     high total entropy raises an explicit analyst-review flag instead of
     being auto-alerted. Older data.js files have no such block, so the
     card degrades to a short "regenerate data.js" line. */
  const uncBlock = it => {
    const u = it.uncertainty;
    if (!u || typeof u.confidence !== "number") {
      return `<div class="unc"><div class="unc-h"><span class="ul">MODEL CONFIDENCE</span>
        <span class="uv">n/a</span></div>
        <div class="unc-na">not in this data.js - regenerate with scripts/run_demo.py</div></div>`;
    }
    const pct = Math.round(Math.max(0, Math.min(1, u.confidence)) * 100);
    const num = v => (typeof v === "number" ? v : 0).toFixed(2);
    return `
      <div class="unc" title="Ensemble of bootstrapped Stage-2 classifiers on simulated spectra. Confidence is the mean top-class probability; total and epistemic are predictive entropies normalised to 0-1. Reported only: it never changes the risk level.">
        <div class="unc-h"><span class="ul">MODEL CONFIDENCE</span>
          <span class="uv">${u.confidence.toFixed(2)}</span></div>
        <div class="ubar"><i style="width:${pct}%"></i></div>
        <div class="unc-m">uncertainty total ${num(u.total)} · epistemic ${num(u.epistemic)}${
          u.review_recommended ? "" : " · below review threshold"}</div>
        ${u.review_recommended
          ? `<div class="review"><span class="g" aria-hidden="true">&#9873;</span>ANALYST REVIEW RECOMMENDED</div>`
          : ""}
      </div>`;
  };

  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = intakes.map((it, i) => {
    const t = trendOf(it), p = it.bloom.probs, u = it.uncertainty;
    const aria = `${esc(it.name)}: ${it.risk.level}, risk ${it.risk.score.toFixed(2)}.` +
      (u ? ` Model confidence ${u.confidence.toFixed(2)}.` +
           (u.review_recommended ? " Analyst review recommended." : "") : "") +
      ` Select to chart.`;
    return `
    <div class="card lvl-${it.risk.level}" role="button" tabindex="0" data-i="${i}"
         aria-pressed="false" aria-label="${aria}">
      <div class="c-top">
        <div>
          <div class="c-name">${esc(it.name)}</div>
          <div class="c-kind">${kindIcon(it.kind)} ${esc(it.kind.replace(/_/g, " ").toUpperCase())}</div>
          <div class="c-geo">${it.lat.toFixed(3)}°N ${it.lon.toFixed(3)}°E</div>
        </div>
        ${chip(it.risk.level)}
      </div>
      <div class="c-mid">
        ${dialSVG(it.risk.score, it.risk.level)}
        <div class="c-facts">
          <div><div class="fl">DOMINANT CLASS</div>
               <div class="fv">${CLASS_NAME[it.bloom.dominant] || esc(it.bloom.dominant)}</div></div>
          <div><div class="fl">CHL-A ESTIMATE</div>
               <div class="fv">${it.bloom.chl_mg_m3.toFixed(1)} <small>mg/m³</small></div></div>
          <div><div class="fl">7-DAY OUTLOOK</div>
               <div class="trend ${t.cls}">${t.txt}</div></div>
        </div>
      </div>
      <div class="probs">
        <span>P(no bloom) <b>${p.no_bloom.toFixed(2)}</b></span>
        <span>P(dino) <b>${p.dinoflagellate.toFixed(2)}</b></span>
        <span>P(cyano) <b>${p.cyanobacteria.toFixed(2)}</b></span>
      </div>
      <ul class="rationale">${it.risk.rationale.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      ${uncBlock(it)}
    </div>`;
  }).join("");

  /* ---------- 04 · tabs ---------- */
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = intakes.map((it, i) => `
    <button role="tab" id="tab-${i}" aria-selected="false" tabindex="-1" data-i="${i}">
      <span class="d" style="background:${LVL[it.risk.level].hex}" aria-hidden="true"></span>
      ${esc(it.name)}
    </button>`).join("");

  /* ---------- shared tooltip ---------- */
  const tt = document.getElementById("tt");
  const showTT = (html, x, y) => {
    tt.innerHTML = html;
    tt.style.display = "block";
    const w = tt.offsetWidth, h = tt.offsetHeight;
    tt.style.left = Math.min(x + 16, window.innerWidth - w - 8) + "px";
    tt.style.top = Math.max(8, Math.min(y - h - 14, window.innerHeight - h - 8)) + "px";
  };
  const hideTT = () => { tt.style.display = "none"; };

  /* ---------- 04 · history + forecast chart ---------- */
  const RC = {W: 960, H: 340, l: 46, r: 14, t: 30, b: 34};
  RC.pw = RC.W - RC.l - RC.r; RC.ph = RC.H - RC.t - RC.b;
  const rx = d => RC.l + (d + 29) / 36 * RC.pw;
  const ry = v => RC.t + (1 - v) * RC.ph;

  function renderRiskChart(i) {
    const it = intakes[i];
    const hist = it.history.map(p => [p.day, p.score]);
    const day0 = it.history[it.history.length - 1];
    // Band and mean start at day 0 so forecast visually continues the history.
    const fc = [{day: 0, score: day0.score, lo: day0.score, hi: day0.score}, ...it.forecast];
    const bandPts = fc.map(p => [rx(p.day), ry(p.hi)])
      .concat(fc.slice().reverse().map(p => [rx(p.day), ry(p.lo)]));
    const yGrid = [0, .25, .5, .75, 1].map(v => `
      <line x1="${RC.l}" x2="${RC.l + RC.pw}" y1="${ry(v)}" y2="${ry(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text class="axis-t" x="${RC.l - 8}" y="${ry(v) + 4}" text-anchor="end">${v.toFixed(2)}</text>`).join("");
    const xTicks = [-21, -14, -7, 0, 7].map(d => `
      <text class="axis-t" x="${rx(d)}" y="${RC.H - 12}" text-anchor="middle">${d > 0 ? "+" + d : d}</text>`).join("");
    const thr = (v, col, lab) => `
      <line x1="${RC.l}" x2="${RC.l + RC.pw}" y1="${ry(v)}" y2="${ry(v)}"
            stroke="${col}" stroke-width="1" stroke-dasharray="5 5" opacity=".5"/>
      <text class="axis-t" x="${RC.l + RC.pw - 4}" y="${ry(v) - 5}" text-anchor="end" opacity=".9">${lab}</text>`;

    document.getElementById("rc-title").textContent =
      `${it.name} - risk index, day −29 → +7`;
    document.getElementById("rc-sub").textContent =
      `today ${it.risk.score.toFixed(2)} · day +7 mean ` +
      `${it.forecast[it.forecast.length - 1].score.toFixed(2)} ` +
